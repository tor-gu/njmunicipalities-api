version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --upgrade pip
      - pip install --upgrade awscli aws-sam-cli boto3
  build:
    commands:
      # Load data with the CodeBuild service role, before assume-role replaces
      # its credentials. The load is not atomic, so sam deploy then recycles the
      # lambdas by changing DataVersion when the data has changed.
      - python scripts/load_data.py --env-prefix "${ENV_ENV_PREFIX}" --region ${ENV_REGION}
      - DATA_VERSION=$(sed -n 's/^version=//p' data/SOURCE)
      - . ./assume-role.sh ${ENV_PIPELINE_EXECUTION_ROLE} deploy
      - sam deploy --stack-name ${ENV_STACK_NAME}
                    --template ${ENV_TEMPLATE}
                    --capabilities CAPABILITY_IAM
                    --region ${ENV_REGION}
                    --s3-bucket ${ENV_BUCKET}
                    --no-fail-on-empty-changeset
                    --role-arn ${ENV_CLOUDFORMATION_EXECUTION_ROLE}
                    --parameter-overrides \
                          TorguapiLayerArn=${ENV_TORGUAPI_LAYER_ARN} \
                          TorguapiLayerVersion=${ENV_TORGUAPI_LAYER_VERSION} \
                          EnvPrefix=\"${ENV_ENV_PREFIX}\" \
                          DataVersion=${DATA_VERSION} \
                          ApiRoot=${ENV_API_ROOT}
